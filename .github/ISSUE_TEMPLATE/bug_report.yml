name: 🐛 Bug Report
description: File a bug report to help us fix issues in CORD
title: "[Bug]: "
labels: ["bug", "sentinel-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Bugs are automatically triaged by the **Autonomous Sentinel** to generate regression tests and fix patches.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run `cord`
        2. Type `...`
        3. See error
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: OS version, Python version, active model, and provider.
      value: |
        - OS: Windows 11 / Linux / macOS
        - Python: 3.11.x
        - Active Model:
        - Active Provider:
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Terminal Logs / Traceback
      description: Please copy and paste any error output or traceback.
      render: shell
