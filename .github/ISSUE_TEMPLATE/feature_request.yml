name: 🚀 Feature Request / Proposal
description: Suggest an idea, new tool, or enhancement to CORD
title: "[Feature]: "
labels: ["enhancement", "sentinel-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping make CORD better! All feature suggestions are reviewed by the **CORD Autonomous Sentinel Council** (Architect, Security Auditor, UX Lead, QA Engineer) which deliberates and assigns an RFC score.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem or limitation is.
      placeholder: "I'm always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: Any alternative solutions or features you've evaluated.
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      options:
        - Swarm / Multi-Agent Mesh
        - Code Graph / Blast Radius
        - Tools / Dynamic Tool Creation
        - Terminal UI / TUI / Animations
        - Voice / Vision / Computer-Use
        - Provider / LLM Client
        - Other
