[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cord-cli"
version = "1.4.0"
description = "Autonomous Terminal Coding Agent inspired by Claude Code and Codex"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.30",
    "httpx>=0.24.0",
]

[project.scripts]
cord = "cord.main:main"
